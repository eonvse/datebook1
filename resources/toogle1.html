<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
/* Базовые стили для контейнера переключателя */
.switch {
  position: relative;
  display: inline-block;
  width: 100px; /* Увеличиваем ширину для текста */
  height: 34px;
}

/* Скрываем стандартный checkbox */
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

/* Стили для ползунка */
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: 0.4s;
  border-radius: 34px;
}

/* Круглый бегунок внутри ползунка */
.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: 0.4s;
  border-radius: 50%;
  z-index: 2;
}

/* Текст внутри переключателя */
.slider .text {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  font-weight: bold;
  color: white;
  z-index: 1;
  transition: opacity 0.4s;
}

/* Позиционирование текста "Вкл" */
.slider .on {
  left: 10px;
  opacity: 0; /* Скрываем по умолчанию */
}

/* Позиционирование текста "Выкл" */
.slider .off {
  right: 10px;
  opacity: 1; /* Показываем по умолчанию */
}

/* Изменение цвета ползунка, когда checkbox активен */
input:checked + .slider {
  background-color: #2196F3;
}

/* Сдвиг бегунка вправо, когда checkbox активен */
input:checked + .slider:before {
  transform: translateX(66px); /* Сдвигаем бегунок вправо */
}

/* Показываем текст "Вкл" и скрываем "Выкл" при активации */
input:checked + .slider .on {
  opacity: 1;
}

input:checked + .slider .off {
  opacity: 0;
}

/* Дополнительно: стиль для переключателя в форме прямоугольника */
.slider.rect {
  border-radius: 4px;
}

.slider.rect:before {
  border-radius: 4px;
}

/* Поддержка тёмной темы */
@media (prefers-color-scheme: dark) {
  body {
    background-color: #121212;
    color: #ffffff;
  }

  .slider {
    background-color: #555;
  }

  input:checked + .slider {
    background-color: #1e88e5;
  }

  .slider:before {
    background-color: #e0e0e0;
  }

  .slider .text {
    color: #000;
  }
}
    </style>
</head>
<body>
    <label class="switch">
        <input type="checkbox">
        <span class="slider rect">
          <span class="text on">Вкл</span>
          <span class="text off">Выкл</span>
        </span>
    </label>  
</body>
</html>
