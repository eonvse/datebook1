<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        /* Базовые стили для контейнера переключателя */
.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

/* Скрываем стандартный checkbox */
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

/* Стили для ползунка */
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: 0.4s;
  border-radius: 34px;
}

/* Круглый бегунок внутри ползунка */
.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: 0.4s;
  border-radius: 50%;
}

/* Изменение цвета ползунка, когда checkbox активен */
input:checked + .slider {
  background-color: #2196F3;
}

/* Сдвиг бегунка вправо, когда checkbox активен */
input:checked + .slider:before {
  transform: translateX(26px);
}

/* Дополнительно: стиль для переключателя в форме прямоугольника */
.slider.rect {
  border-radius: 4px;
}

.slider.rect:before {
  border-radius: 4px;
}
    </style>
</head>
<body>
    <label class="switch">
        <input type="checkbox">
        <span class="slider rect"></span>
    </label>   
</body>
</html>
